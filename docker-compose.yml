services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bravy_bpmn
      POSTGRES_USER: bravy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bravy123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bravy -d bravy_bpmn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bravy:${DB_PASSWORD:-bravy123}@db:5432/bravy_bpmn
      JWT_SECRET: ${JWT_SECRET:-bravy-bpmn-jwt-secret-2026}
      CORS_ORIGIN: http://localhost:3000
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
